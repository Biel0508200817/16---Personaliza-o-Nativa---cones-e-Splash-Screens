
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Identidade do aplicativo -->
    <title>ChefSkill | Receitas e Lista de Mercado</title>

    <meta
      name="description"
      content="Descubra receitas, acompanhe preparos passo a passo e organize sua lista de mercado com o ChefSkill."
    />

    <meta name="theme-color" content="#183B32" />
    <meta name="color-scheme" content="light" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />

    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      <p>
        Para utilizar o ChefSkill, habilite o JavaScript no seu dispositivo.
